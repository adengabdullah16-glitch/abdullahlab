<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generator Asesmen Sumatif</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#e2e6ec;--acc:#0f766e;--acc2:#e3f3f1;--warn:#a15c07;--warnbg:#fef3c7;--bad:#b42318;--badbg:#fee4e2;--ok:#067647;--okbg:#dcfae6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
textarea{resize:vertical;min-height:64px}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--acc);transform:scale(1.15);margin:0 6px 0 0}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.ghost{background:transparent;border-color:transparent;color:var(--acc);padding:6px 8px}
button.sm{padding:5px 10px;font-size:13px;border-radius:8px}
button.danger{color:var(--bad)}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand b{display:block;font-size:15px}
.brand small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.ib{padding:7px 10px;font-size:17px;line-height:1}
.topbtn{display:flex;gap:6px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;border-radius:999px;font-size:13px;padding:6px 12px;font-weight:600;color:var(--muted)}
.steps button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.steps button.done{color:var(--acc);border-color:var(--acc)}
main{max-width:920px;margin:0 auto;padding:14px 14px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 4px}
.card h3{font-size:15px;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.grid .full{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#eef1f5;color:#344054;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.acc{background:var(--acc2);color:var(--acc)}
.note{background:var(--acc2);color:#134e48;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.note.warn{background:var(--warnbg);color:#7a4605}
.note.bad{background:var(--badbg);color:#7a1a12}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tbox{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tbox b{font-size:13px;display:block}
.tbox small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3;margin-bottom:6px;min-height:30px}
.krow{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fcfcfd}
.krow .kh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.krow .kh select{width:auto;padding:5px 8px;font-size:14px}
.krow .no{font-weight:800;min-width:44px}
.krow input,.krow textarea{margin-bottom:6px}
.scard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff}
.scard.prob{border-color:#f5b8b1}
.shead{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.shead .no{font-weight:800;font-size:16px;margin-right:2px}
.ind{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.stem{margin:6px 0}
.stem pre,.cb{background:#f2f4f7;border-radius:8px;padding:8px 10px;overflow:auto;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;margin:6px 0;white-space:pre}
.opts{margin:4px 0 0;padding:0;list-style:none}
.opts li{padding:3px 8px;border-radius:8px;margin:2px 0}
.opts li.k{background:var(--okbg);font-weight:600}
.opts li b{display:inline-block;width:22px}
table.mini{border-collapse:collapse;width:100%;font-size:14px;margin:4px 0}
table.mini td,table.mini th{border:1px solid var(--line);padding:4px 7px;text-align:left;vertical-align:top}
.issues{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.issue{font-size:13px;padding:6px 9px;border-radius:8px;background:var(--badbg);color:#7a1a12}
.issue.w{background:var(--warnbg);color:#7a4605}
.sact{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pemb{font-size:13px;color:#344054;background:#f8f9fb;border-radius:8px;padding:7px 10px;margin-top:8px}
.ef{display:flex;flex-direction:column;gap:8px}
.ef .oprow{display:flex;gap:6px;align-items:center}
.ef .oprow b{width:20px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.nav .badge{flex:1;text-align:center;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .badge.bad{color:var(--bad);font-weight:600}
.busy{position:fixed;inset:0;z-index:50;background:rgba(16,24,40,.45);display:grid;place-items:center;padding:20px}
.busybox{background:#fff;border-radius:16px;padding:22px;max-width:380px;width:100%;text-align:center}
.spin{width:36px;height:36px;border:4px solid var(--acc2);border-top-color:var(--acc);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#busyText{font-weight:600}
#busyProg{color:var(--muted);font-size:13px;margin:6px 0 12px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(16,24,40,.45);display:flex;align-items:flex-end;justify-content:center}
.mbox{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;padding-bottom:max(18px,env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.mbox{border-radius:18px}}
.mbox h2{margin:0 0 10px;font-size:18px}
.mbox .fld{margin-bottom:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--acc);color:#fff}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:10px 0}
details summary{font-weight:600;cursor:pointer}
details ol{padding-left:20px;margin:8px 0}
.pop{position:fixed;top:56px;right:12px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(16,24,40,.15);padding:6px;min-width:220px}
.pop button{display:block;width:100%;text-align:left;border:0;font-weight:500}
.pop button:hover{background:#f2f4f7}
.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.expi{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.expi .ic{width:40px;height:40px;border-radius:10px;background:var(--acc2);color:var(--acc);display:grid;place-items:center;font-weight:800;flex:none;font-size:12px}
.expi div{flex:1;min-width:0}
.expi small{display:block;color:var(--muted);font-size:12.5px}
.sum{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;margin-bottom:10px}
.cnt{font-size:12px;color:var(--muted);text-align:right;margin-top:2px}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">GAS</span><div><b>Generator Asesmen Sumatif</b><small id="projLabel"></small></div></div>
  <div class="topbtn">
    <button class="ib" data-act="openSettings" title="Pengaturan AI" aria-label="Pengaturan AI">⚙️</button>
    <button class="ib" data-act="menu" title="Menu" aria-label="Menu">☰</button>
  </div>
</header>
<div id="menuPop" class="pop hidden">
  <button data-act="newProj">➕ Proyek baru</button>
  <button data-act="saveFile">💾 Simpan proyek ke file (.json)</button>
  <button data-act="openFile">📂 Buka file proyek</button>
  <button data-act="openSettings">⚙️ Pengaturan AI</button>
  <button data-act="help">❓ Panduan singkat</button>
</div>
<nav class="steps" id="steps"></nav>
<main id="main"></main>
<footer class="nav">
  <button data-act="prev" id="btnPrev">‹ Kembali</button>
  <span class="badge" id="aiBadge"></span>
  <button class="pri" data-act="next" id="btnNext">Lanjut ›</button>
</footer>
<div id="busy" class="busy hidden"><div class="busybox"><div class="spin"></div><div id="busyText"></div><div id="busyProg"></div><button data-act="stop">Hentikan</button></div></div>
<div id="modal" class="modal hidden"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
<input type="file" id="fProj" accept=".json,application/json" hidden>
<input type="file" id="fMateri" accept=".pdf,.txt,application/pdf,text/plain" multiple hidden>

<!-- ================= PEMBUAT DOKUMEN .DOCX ================= -->
<script id="exporters">
(function(){
'use strict';
const LET='ABCDEFGHIJ';
const NAMA_BENTUK={PG:'Pilihan Ganda',PGX:'PG Kompleks',BNR:'Benar-Salah',JD:'Menjodohkan',JDX:'Menjodohkan',URT:'Mengurutkan',SKT:'Isian Singkat',ESY:'Uraian'};
const BAGIAN={
  PG:['Pilihan Ganda','Pilihlah satu jawaban yang paling tepat!'],
  PGX:['Pilihan Ganda Kompleks','Pilihlah semua jawaban yang benar (jawaban benar bisa lebih dari satu)!'],
  BNR:['Benar atau Salah','Tentukan apakah setiap pernyataan berikut Benar (B) atau Salah (S)!'],
  JD:['Menjodohkan','Pasangkan pernyataan di lajur kiri dengan jawaban yang tepat di lajur kanan!'],
  JDX:['Menjodohkan','Pasangkan pernyataan di lajur kiri dengan jawaban yang tepat di lajur kanan! Ada jawaban di lajur kanan yang tidak memiliki pasangan.'],
  URT:['Mengurutkan','Urutkan pilihan berikut dengan benar, lalu tuliskan urutan hurufnya!'],
  SKT:['Isian Singkat','Isilah titik-titik dengan jawaban yang singkat dan tepat!'],
  ESY:['Uraian','Jawablah pertanyaan berikut dengan jelas dan tepat!']
};
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuffleSeed(arr,seed){const a=arr.slice();let x=hash(seed)||1;for(let i=a.length-1;i>0;i--){x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function acakJD(s){
  const kanan=(s.pasangan||[]).map((p,i)=>({t:p.kanan,i})).concat(s.tipe==='JDX'?(s.pengecoh||[]).map(t=>({t,i:-1})):[]);
  const ac=shuffleSeed(kanan,s.id+'jd');
  const kunci=(s.pasangan||[]).map((p,i)=>`${i+1}-${LET[ac.findIndex(x=>x.i===i)]}`).join(', ');
  return {kanan:ac.map(x=>x.t),kunci};
}
function acakURT(s){
  let ac=shuffleSeed((s.urutan||[]).map((t,i)=>({t,i})),s.id+'urt');
  if(ac.length>1&&ac.every((x,k)=>x.i===k)) ac=ac.slice(1).concat(ac[0]);
  const kunci=(s.urutan||[]).map((_,i)=>LET[ac.findIndex(x=>x.i===i)]).join(', ');
  return {acak:ac.map(x=>x.t),kunci};
}
function kunciTeks(s){
  if(!s) return '';
  switch(s.tipe){
    case 'PG': case 'PGX': return s.kunci||'';
    case 'BNR': return (s.pernyataan||[]).map((p,i)=>`${i+1}. ${p.benar?'B':'S'}`).join('; ');
    case 'JD': case 'JDX': return acakJD(s).kunci;
    case 'URT': return acakURT(s).kunci;
    default: return s.kunci||'';
  }
}
function bentukRingkas(P){
  const c={};P.kisi.forEach(r=>{const n=NAMA_BENTUK[r.tipe];c[n]=(c[n]||0)+1});
  return Object.entries(c).map(([k,v])=>`${v} ${k}`).join(', ');
}
function cpTeks(P,kode){const c=(P.cp||[]).find(x=>String(x.kode)===String(kode));return c?c.teks:String(kode||'')}
function aman(s){return String(s||'').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'_').slice(0,60)||'dokumen'}

window.GASH={LET,NAMA_BENTUK,BAGIAN,acakJD,acakURT,kunciTeks,shuffleSeed,hash};

function make(kind,P){
  const D=window.docx;
  if(!D) throw new Error('Pustaka dokumen belum termuat.');
  const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,AlignmentType,BorderStyle,VerticalMergeType,ShadingType,PageOrientation,TableLayoutType,VerticalAlign}=D;
  const I=P.identitas||{};
  const NONE={style:BorderStyle.NONE,size:0,color:'FFFFFF'};
  const NOB={top:NONE,bottom:NONE,left:NONE,right:NONE,insideHorizontal:NONE,insideVertical:NONE};

  function page(land){
    const k=(P.ekspor&&P.ekspor.kertas)||'A4';
    const sz=k==='F4'?{w:12189,h:18709}:{w:11906,h:16838};
    const m=1134;
    return {props:{page:{size:{width:sz.w,height:sz.h,orientation:land?PageOrientation.LANDSCAPE:PageOrientation.PORTRAIT},margin:{top:m,bottom:m,left:m,right:m}}},usable:(land?sz.h:sz.w)-2*m};
  }
  function scale(ws,total){const s=ws.reduce((a,b)=>a+b,0);const o=ws.map(w=>Math.floor(w*total/s));o[o.length-1]+=total-o.reduce((a,b)=>a+b,0);return o}
  function para(text,o={}){
    const lines=String(text==null?'':text).split('\n');
    return new Paragraph({alignment:o.align,spacing:{after:o.after==null?0:o.after,before:o.before||0},indent:o.indent,keepNext:o.keepNext,
      children:lines.map((ln,i)=>new TextRun({text:ln,bold:o.bold,italics:o.italic,size:o.size,font:o.font,break:i>0?1:undefined}))});
  }
  // teks dengan blok kode ```...``` -> paragraf (kode memakai Courier New)
  function rich(text,o={}){
    const out=[];const parts=String(text||'').split(/```[a-zA-Z0-9]*\n?/);
    parts.forEach((seg,i)=>{
      const code=i%2===1;
      seg=seg.replace(/^\n+|\n+$/g,'');
      if(!seg) return;
      seg.split('\n').forEach((line,j)=>{
        const pre=(j===0&&out.length===0&&o.prefix)?o.prefix:'';
        out.push(new Paragraph({indent:(out.length===0?o.indentFirst:null)||o.indent,spacing:{after:0},keepNext:o.keepNext,
          children:[new TextRun({text:pre+(line||''),font:code?'Courier New':undefined,size:code?(o.size?o.size-2:22):o.size,bold:o.bold})]}));
      });
    });
    if(!out.length) out.push(new Paragraph({indent:o.indentFirst||o.indent,children:[new TextRun({text:o.prefix||'',size:o.size})]}));
    return out;
  }
  function cell(children,w,o={}){
    const ch=(Array.isArray(children)?children:[children]).map(c=>typeof c==='string'?para(c,{size:o.size}):c);
    return new TableCell({children:ch.length?ch:[para('')],width:{size:w,type:WidthType.DXA},columnSpan:o.span,verticalMerge:o.vm,
      shading:o.shade?{fill:o.shade,type:ShadingType.CLEAR,color:'auto'}:undefined,verticalAlign:o.va,
      margins:{top:50,bottom:50,left:90,right:90}});
  }
  function table(ws,rows,o={}){
    return new Table({columnWidths:ws,width:{size:ws.reduce((a,b)=>a+b,0),type:WidthType.DXA},layout:TableLayoutType.FIXED,rows,borders:o.noBorder?NOB:undefined,indent:o.indent?{size:o.indent,type:WidthType.DXA}:undefined});
  }
  function tr(cells,o={}){return new TableRow({children:cells,cantSplit:o.cantSplit,tableHeader:o.header})}
  function judul(lines){return lines.filter(Boolean).map((t,i)=>para(t,{bold:true,align:AlignmentType.CENTER,size:i===0?28:24}))}
  function identitas(pairs,usable,size){
    const ws=scale([3200,300,6000],Math.min(usable,9600));
    return table(ws,pairs.map(([a,b])=>tr([cell(para(a,{size}),ws[0]),cell(para(':',{size}),ws[1]),cell(para(b,{size}),ws[2])])),{noBorder:true});
  }
  function ttd(usable){
    const ws=scale([1,1],usable);
    const kiri=['Mengetahui,','Kepala Sekolah','','','',I.kepsek||'..............................',I.nipKepsek?('NIP. '+I.nipKepsek):'NIP. '];
    const kanan=[(I.kota||'..............')+', '+(I.tanggal||'..............................'),'Guru Mata Pelajaran','','','',I.penulis||'..............................',I.nipPenulis?('NIP. '+I.nipPenulis):'NIP. '];
    const mk=a=>a.map((t,i)=>para(t,{bold:i===5}));
    return table(ws,[tr([cell(mk(kiri),ws[0]),cell(mk(kanan),ws[1])],{cantSplit:true})],{noBorder:true});
  }
  const spasi=()=>para('',{});
  const docOpt=sections=>new Document({creator:'Generator Asesmen Sumatif',title:'Asesmen Sumatif',
    styles:{default:{document:{run:{font:'Times New Roman',size:24}}}},sections});
  const items=P.kisi.map((row,i)=>({no:i+1,row,s:P.soal[row.id]||null}));
  const kelasSem=[I.kelas,I.semester].filter(Boolean).join(' / ');

  // ---------- isi soal (naskah & kartu) ----------
  function isiSoal(it,o){
    const s=it.s,out=[];const sz=o.size;const L=o.left||0;
    out.push(...rich(s.stem,{size:sz,prefix:o.nomor?`${it.no}. `:'',indentFirst:o.nomor?{left:L+400,hanging:400}:undefined,indent:{left:L+(o.nomor?400:0)}}));
    const ind={left:L+(o.nomor?800:400),hanging:400};
    if(s.tipe==='PG'||s.tipe==='PGX'){
      (s.opsi||[]).forEach((t,i)=>out.push(...rich(t,{size:sz,prefix:`${LET[i]}. `,indentFirst:ind,indent:{left:ind.left}})));
    }else if(s.tipe==='BNR'){
      if(o.tabel){
        const W=o.width-L-(o.nomor?400:0);const ws=scale([600,W-1600,500,500],W);
        out.push(new Paragraph({children:[]}));
        out.push(table(ws,[tr(['No','Pernyataan','B','S'].map((h,k)=>cell(para(h,{bold:true,size:sz,align:AlignmentType.CENTER}),ws[k],{shade:'EEEEEE'})),{header:true})]
          .concat((s.pernyataan||[]).map((p,i)=>tr([cell(para(String(i+1),{size:sz,align:AlignmentType.CENTER}),ws[0]),cell(para(p.teks,{size:sz}),ws[1]),cell(para('',{size:sz}),ws[2]),cell(para('',{size:sz}),ws[3])]))),{indent:L+(o.nomor?400:0)}));
      }else (s.pernyataan||[]).forEach((p,i)=>out.push(para(`${i+1}. ${p.teks}`+(o.kunci?` (${p.benar?'B':'S'})`:''),{size:sz,indent:ind})));
    }else if(s.tipe==='JD'||s.tipe==='JDX'){
      const {kanan}=acakJD(s);const kiri=(s.pasangan||[]).map(p=>p.kiri);
      const n=Math.max(kiri.length,kanan.length);
      if(o.tabel){
        const W=o.width-L-(o.nomor?400:0);const ws=scale([600,(W-2300)/2,1200,500,(W-2300)/2],W);
        const rows=[tr(['No','Lajur Kiri','Jawaban','','Lajur Kanan'].map((h,k)=>cell(para(h,{bold:true,size:sz,align:AlignmentType.CENTER}),ws[k],{shade:'EEEEEE'})),{header:true})];
        for(let i=0;i<n;i++) rows.push(tr([

  // ---------- 1. KISI-KISI ----------
  function docKisi(){

    const ch=[...judul(['KISI-KISI PENULISAN SOAL',(I.asesmen||'').toUpperCase(),I.sekolah?I.sekolah.toUpperCase():'']),spasi(),
      identitas([['Jenjang Pendidikan',I.jenjang||''],['Mata Pelajaran',I.mapel||''],['Kelas/Semester',kelasSem],['Kurikulum',I.kurikulum||''],['Alokasi Waktu',I.waktu||''],['Jumlah Soal',items.length+' soal'],['Bentuk Soal',bentukRingkas(P)],['Tahun Pelajaran',I.tahun||'']],usable,22),
      spasi(),table(ws,rows),spasi(),ttd(usable)];

  // ---------- 2. KARTU SOAL ----------
  function docKartu(){
    const {props,usable}=page(false);
    const ws=scale([2700,4900,2000],usable);const SZ=22;
    const ch=[];
    items.forEach((it,idx)=>{
      if(!it.s) return;
      const r=it.row,s=it.s;
      ch.push(...judul(['KARTU SOAL',I.asesmen||'','Tahun Pelajaran '+(I.tahun||'')]).map(p=>p));
      const iw=scale([1,1],usable);
      const kv=(a,b)=>para(`${a} : ${b}`,{size:SZ});
      ch.push(table(iw,[tr([cell(kv('Mata Pelajaran',I.mapel||''),iw[0]),cell(kv('Kurikulum',I.kurikulum||''),iw[1])]),tr([cell(kv('Kelas/Semester',kelasSem),iw[0]),cell(kv('Penulis Soal',I.penulis||''),iw[1])])],{noBorder:true}));
      ch.push(para('',{size:8}));
      const lbl=t=>para(t,{bold:true,size:SZ});

        tr([cell([lbl('Capaian Pembelajaran:'),para(cpTeks(P,r.cp),{size:SZ})],ws[0]),cell([lbl('Buku Acuan/Referensi:'),para(I.buku||'-',{size:SZ})],ws[1]),cell([lbl('Level Kognitif:'),para(r.level,{size:SZ})],ws[2])],{cantSplit:true}),
        tr([cell([lbl('No. Soal:'),para(String(it.no),{size:SZ}),para(''),lbl('Konten/Materi:'),para(r.materi,{size:SZ}),para(''),lbl('Indikator Soal:'),para(r.indikator,{size:SZ})],ws[0]),
            cell([lbl('Rumusan Soal ('+NAMA_BENTUK[s.tipe]+'):'),...isiSoal(it,{size:SZ,kunci:true,width:ws[1]})],ws[1]),

  // ---------- 3. NASKAH SOAL ----------
  function docNaskah(){

  // ---------- 4. KUNCI & PEDOMAN ----------
  function docKunci(){
    const {props,usable}=page(false);

    const rows=[tr(['No.','Bentuk','Kunci Jawaban','Skor'].map((h,k)=>cell(para(h,{bold:true,align:AlignmentType.CENTER}),ws[k],{shade:'D9E2EC'})),{header:true})];

    items.forEach(it=>{if(!it.s)return;const sk=Number(it.s.skor)||1;total+=sk;
      rows.push(tr([cell(para(String(it.no),{align:AlignmentType.CENTER}),ws[0]),cell(para(NAMA_BENTUK[it.s.tipe]),ws[1]),cell(it.s.tipe==='ESY'?[para('Lihat pedoman penskoran di bawah',{italic:true})]:rich(kunciTeks(it.s)),ws[2]),cell(para(String(sk),{align:AlignmentType.CENTER}),ws[3])]))});
    rows.push(tr([cell(para('Skor maksimal',{bold:true}),ws[0]+ws[1]+ws[2],{span:3}),cell(para(String(total),{bold:true,align:AlignmentType.CENTER}),ws[3])]));
    const ch=[...judul(['KUNCI JAWABAN DAN PEDOMAN PENSKORAN',(I.asesmen||'').toUpperCase(),'TAHUN PELAJARAN '+(I.tahun||'')]),spasi(),
      identitas([['Mata Pelajaran',I.mapel||''],['Kelas/Semester',kelasSem]],usable),spasi(),table(ws,rows),spasi()];
    const esy=items.filter(it=>it.s&&it.s.tipe==='ESY');
    if(esy.length){
      ch.push(para('Pedoman Penskoran Soal Uraian',{bold:true,before:120,after:80}));
      esy.forEach(it=>{
        ch.push(...rich(it.s.stem,{prefix:`${it.no}. `,indentFirst:{left:400,hanging:400},indent:{left:400},bold:true}));
        ch.push(para('Jawaban rujukan:',{bold:true,indent:{left:400}}));ch.push(...rich(it.s.kunci||'-',{indent:{left:400}}));
        ch.push(para(`Pedoman penskoran (skor maksimal ${it.s.skor||''}):`,{bold:true,indent:{left:400}}));ch.push(...rich(it.s.pedoman||'-',{indent:{left:400}}));
        ch.push(para('',{after:120}));
      });
    }
    ch.push(para('Nilai akhir = (skor perolehan ÷ skor maksimal) × 100',{italic:true,before:120}));
    ch.push(spasi(),ttd(usable));
    return docOpt([{properties:props,children:ch}]);
  }

  // ---------- 5. FORMAT EXTRAORDINARY CBT ----------
  function docCBT(){
    const {props,usable}=page(false);
    const ws=scale([1100,8500],usable);
    const ch=[];
    const absAuto={PG:!!(P.ekspor&&P.ekspor.absPG),PGX:true,BNR:true,JD:true,JDX:true,URT:true,SKT:false,ESY:false};
    const txt=t=>rich(t,{});
    items.forEach(it=>{
      const s=it.s;if(!s) return;
      const r=it.row;let kj='';const extra=[];
      if(s.tipe==='PG'||s.tipe==='PGX'){kj=s.kunci||'';(s.opsi||[]).forEach((o,i)=>extra.push([LET[i],o]))}
      else if(s.tipe==='BNR'){(s.pernyataan||[]).forEach(p=>extra.push([p.benar?'Y':'N',p.teks]))}
      else if(s.tipe==='JD'||s.tipe==='JDX'){
        const ps=s.pasangan||[];kj=ps.map((p,i)=>`${LET[i]}1-${LET[i]}2`).join(', ');
        ps.forEach((p,i)=>{extra.push([LET[i]+'1',p.kiri]);extra.push([LET[i]+'2',p.kanan])});
        if(s.tipe==='JDX')(s.pengecoh||[]).forEach(t=>extra.push(['',t]));
      }
      else if(s.tipe==='URT'){(s.urutan||[]).forEach(t=>extra.push(['',t]))}
      else kj=s.kunci||'';
      const rows=[['TS',s.tipe],['KD',String(r.cp||'')],['KJ',kj],['ABS',absAuto[s.tipe]?'Y':'']].map(([a,b])=>tr([cell(para(a),ws[0]),cell(para(b),ws[1])]));
      rows.push(tr([cell(para(it.no+'.'),ws[0]),cell(txt(s.stem),ws[1])]));
      extra.forEach(([a,b])=>rows.push(tr([cell(para(a),ws[0]),cell(txt(b),ws[1])])));
      ch.push(table(ws,rows));
      ch.push(para(''));
    });
    if(!ch.length) ch.push(para(''));
    return docOpt([{properties:props,children:ch}]);
  }

  const nama=(p)=>`${p}_${aman(I.mapel)}_${aman(I.kelas)}.docx`;
  const peta={kisi:[docKisi,'Kisi-Kisi'],kartu:[docKartu,'Kartu_Soal'],naskah:[docNaskah,'Naskah_Soal'],kunci:[docKunci,'Kunci_dan_Pedoman'],cbt:[docCBT,'Format_CBT']};
  if(!peta[kind]) throw new Error('Jenis dokumen tidak dikenal');
  const doc=peta[kind][0]();
  return {doc,name:nama(peta[kind][1]),Packer};
}
window.GAS_EXPORT={
  build:make,
  async make(kind,P){const {doc,name,Packer}=make(kind,P);const blob=await Packer.toBlob(doc);return {blob,name}}
};
})();

<script>

/* ---------- proyek ---------- */
function tahunAjar(){const d=new Date(),y=d.getFullYear();return d.getMonth()>=6?`${y}/${y+1}`:`${y-1}/${y}`}

/* ---------- utilitas UI ---------- */
let toastT;

function modal(html){$('#mbox').innerHTML=html;$('#modal').classList.remove('hidden')}

async function siapDocx(){if(!window.docx)await loadScript(URL_DOCX)}

function fmt(t){

/* ---------- AI ---------- */

function kirim(c,system,user,json){
  if(c.provider==='gemini'){
    const model=c.model.replace(/^models\//,'');
    const gc={temperature:0.6};if(json!==false)gc.responseMimeType='application/json';

      body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:gc})});
  }

function ambilTeks(c,d){
  if(c.provider==='gemini'){
    const cand=d.candidates&&d.candidates[0];
    if(!cand){throw new Error('AI tidak memberi jawaban'+(d.promptFeedback&&d.promptFeedback.blockReason?' (diblokir: '+d.promptFeedback.blockReason+')':'')+'.')}
    if(cand.finishReason==='MAX_TOKENS')throw new Error('Jawaban AI terpotong (terlalu panjang). Kecilkan "Soal per permintaan" di Pengaturan AI.');
    return ((cand.content&&cand.content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
  }
  if(d.error)throw new Error(d.error.message||'Galat dari OpenRouter');

  if(ch&&ch.finish_reason==='length')throw new Error('Jawaban AI terpotong (terlalu panjang). Kecilkan "Soal per permintaan" di Pengaturan AI.');
  return (ch&&ch.message&&ch.message.content)||'';
}
function parseJSON(t){
  t=String(t||'').trim();
  try{return JSON.parse(t)}catch(e){}
  const f=t.replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  try{return JSON.parse(f)}catch(e){}

function pesanGalat(st,txt,c){
  let m='';try{const j=JSON.parse(txt);m=(j.error&&(j.error.message||j.error))||j.message||''}catch(e){m=txt.slice(0,200)}
  m=String(m);
  if(st===400&&/api key/i.test(m))return 'API key tidak valid. Periksa lagi di Pengaturan AI.';
  if(st===401||st===403)return 'API key ditolak (tidak valid atau tidak punya akses). Periksa di Pengaturan AI.';
  if(st===404)return `Model "${c.model}" tidak ditemukan. Buka Pengaturan AI lalu tekan "Muat daftar model".`;
  if(st===402)return 'Saldo/kredit OpenRouter tidak cukup. Pilih model gratis (berakhiran :free) atau isi kredit.';
  if(st===429)return 'Batas kuota AI tercapai. Tunggu beberapa menit, lalu lanjutkan.';
  return `Galat AI (${st}): ${m}`;
}
async function aiJSON(user,label){
  const c=aiCfg();
  if(!c.key){bukaPengaturan();throw new Error('API key belum diisi. Isi dulu di Pengaturan AI.')}
  let parseGagal=0;
  for(let attempt=0;attempt<5;attempt++){
    if(STOP)throw new Error('Dihentikan.');
    let res;
    try{res=await kirim(c,SYS,user)}catch(e){throw new Error('Tidak bisa terhubung ke layanan AI. Periksa koneksi internet.')}
    if([429,500,502,503,504].includes(res.status)&&attempt<3){
      const ra=parseInt(res.headers.get('retry-after'))||0;
      const wait=ra?ra*1000:[15000,30000,60000][attempt];
      await tunggu(wait,`${label}: server sibuk/kena batas, mencoba lagi dalam {s} detik…`);continue;
    }
    const txt=await res.text();
    if(!res.ok)throw new Error(pesanGalat(res.status,txt,c));
    let d;try{d=JSON.parse(txt)}catch(e){throw new Error('Jawaban server tidak terbaca.')}
    const out=ambilTeks(c,d);
    try{return parseJSON(out)}catch(e){if(++parseGagal<2)continue;throw new Error('Jawaban AI bukan JSON yang valid. Coba lagi atau ganti model.')}
  }
  throw new Error('Batas kuota AI tercapai. Tunggu beberapa menit, lalu lanjutkan.');
}

function promptCek(list){

function ringkasSoal(s){
  const o={stem:s.stem};
  if(s.opsi)o.opsi=s.opsi.map((t,i)=>LET[i]+'. '+t);
  if(s.pernyataan)o.pernyataan=s.pernyataan;
  if(s.pasangan)o.pasangan=s.pasangan;
  if(s.pengecoh)o.pengecoh=s.pengecoh;
  if(s.urutan)o.urutanBenar=s.urutan;
  if(s.tipe!=='BNR'&&s.tipe!=='JD'&&s.tipe!=='JDX'&&s.tipe!=='URT')o.kunci=s.kunci;
  return o;
}

/* ---------- normalisasi ---------- */
function normTipe(t){t=str(t).toUpperCase();const m={URAIAN:'ESY',ESAI:'ESY',ESSAY:'ESY',ESAY:'ESY',ISIAN:'SKT','ISIAN SINGKAT':'SKT','PILIHAN GANDA':'PG','PG KOMPLEKS':'PGX','BENAR SALAH':'BNR',MENJODOHKAN:'JD',MENGURUTKAN:'URT'};return TIPE[t]?t:(m[t]||'PG')}
function normLevel(l){const n=parseInt(String(l).replace(/\D/g,''));return n>=1&&n<=6?'C'+n:'C2'}
function normKisi(out){
  const kode=P.cp.map(c=>String(c.kode));
  return arr(out&&(out.kisi||out.butir)||out).filter(r=>r&&typeof r==='object').map(r=>({id:uid(),cp:kode.includes(str(r.cp))?str(r.cp):(kode[0]||'1'),materi:str(r.materi),level:normLevel(r.level),indikator:str(r.indikator),tipe:normTipe(r.tipe)}));
}
const stripL=t=>str(t).replace(/^\s*[A-Ha-h][\.\)]\s+/,'');
const stripN=t=>str(t).replace(/^\s*\d+[\.\)]\s+/,'');
const truthy=v=>v===true||/^(y|ya|b|benar|true|t)$/i.test(String(v).trim());
function normLetter(k,opsi){
  k=str(k);if(/^[A-Ha-h]$/.test(k))return k.toUpperCase();
  const m=k.match(/^([A-Ha-h])[\.\)\s]/);if(m)return m[1].toUpperCase();
  const i=(opsi||[]).findIndex(o=>o.toLowerCase()===k.toLowerCase());return i>=0?LET[i]:'';
}
function normLetters(k,opsi){const a=Array.isArray(k)?k:str(k).split(/[,;\s]+/);return [...new Set(a.map(x=>normLetter(x,opsi)).filter(Boolean))].sort().join(',')}
function normSoal(r,row){
  const s={id:row.id,tipe:row.tipe,stem:str(r.stem||r.soal||r.pertanyaan),pembahasan:str(r.pembahasan),skor:num(r.skor)||(row.tipe==='ESY'?4:1),cek:null};
  switch(row.tipe){
    case 'PG':s.opsi=arr(r.opsi).map(stripL);s.kunci=normLetter(r.kunci,s.opsi);break;
    case 'PGX':s.opsi=arr(r.opsi).map(stripL);s.kunci=normLetters(r.kunci,s.opsi);break;
    case 'BNR':s.pernyataan=arr(r.pernyataan).map(p=>typeof p==='string'?{teks:p,benar:true}:{teks:str(p.teks||p.pernyataan),benar:truthy(p.benar)});break;
    case 'JD':case 'JDX':s.pasangan=arr(r.pasangan).map(p=>({kiri:str(p.kiri),kanan:str(p.kanan)}));if(row.tipe==='JDX')s.pengecoh=arr(r.pengecoh).map(str).filter(Boolean);break;
    case 'URT':s.urutan=arr(r.urutan).map(stripN).filter(Boolean);break;
    case 'SKT':s.kunci=str(r.kunci||r.jawaban);break;
    case 'ESY':s.kunci=str(r.kunci||r.jawaban);s.pedoman=str(r.pedoman);break;
  }
  return s;
}
// sebar posisi kunci PG agar tidak menumpuk di satu huruf
function seimbangkan(s){
  if(s.tipe!=='PG'||!s.kunci||!s.opsi||s.opsi.length<2)return;
  if(s.opsi.some(o=>/semua|tidak ada yang|(^|\s)[A-H](\s+dan\s+|\s*,\s*)[A-H](\s|$)/i.test(o)))return;
  const n=s.opsi.length;const cnt=Array(n).fill(0);
  Object.values(P.soal).forEach(x=>{if(x&&x!==s&&x.tipe==='PG'&&x.kunci){const i=LET.indexOf(x.kunci);if(i>=0&&i<n)cnt[i]++}});
  const min=Math.min(...cnt);const cand=cnt.map((c,i)=>c===min?i:-1).filter(i=>i>=0);
  const t=cand[window.GASH.hash(s.id)%cand.length];const k=LET.indexOf(s.kunci);
  if(k<0||t===k)return;
  [s.opsi[k],s.opsi[t]]=[s.opsi[t],s.opsi[k]];s.kunci=LET[t];
}
function masalah(s,row){
  const m=[];if(!s)return m;
  if(s.tipe!==row.tipe)m.push(['b',`Bentuk soal (${s.tipe}) tidak sama dengan kisi-kisi (${row.tipe}). Buat ulang soal ini.`]);
  if(!str(s.stem))m.push(['b','Rumusan soal kosong.']);
  if(s.tipe==='PG'){if((s.opsi||[]).length<3)m.push(['b','Opsi kurang dari 3.']);if(!s.kunci||LET.indexOf(s.kunci)>=(s.opsi||[]).length)m.push(['b','Kunci tidak ada di daftar opsi.']);if(new Set((s.opsi||[]).map(o=>o.toLowerCase())).size<(s.opsi||[]).length)m.push(['b','Ada opsi yang sama.']);if((s.opsi||[]).some(o=>!str(o)))m.push(['b','Ada opsi kosong.'])}
  if(s.tipe==='PGX'){const k=(s.kunci||'').split(',').filter(Boolean);if(!k.length)m.push(['b','Kunci belum dipilih.']);if(k.length&&k.length>=(s.opsi||[]).length)m.push(['w','Semua opsi menjadi kunci.']);if(k.some(x=>LET.indexOf(x)>=(s.opsi||[]).length))m.push(['b','Kunci tidak ada di daftar opsi.'])}
  if(s.tipe==='BNR'){if((s.pernyataan||[]).length<2)m.push(['b','Pernyataan kurang dari 2.']);else if((s.pernyataan||[]).every(p=>p.benar)||(s.pernyataan||[]).every(p=>!p.benar))m.push(['w','Semua pernyataan bernilai sama (semua B atau semua S).'])}
  if(s.tipe==='JD'||s.tipe==='JDX'){if((s.pasangan||[]).length<2)m.push(['b','Pasangan kurang dari 2.']);if((s.pasangan||[]).some(p=>!p.kiri||!p.kanan))m.push(['b','Ada pasangan yang kosong.']);if(s.tipe==='JDX'&&!(s.pengecoh||[]).length)m.push(['b','Pengecoh belum ada.'])}
  if(s.tipe==='URT'&&(s.urutan||[]).length<3)m.push(['b','Butir urutan kurang dari 3.']);
  if(s.tipe==='SKT'){if(!s.kunci)m.push(['b','Kunci kosong.']);else if(s.kunci.split(/\s+/).length>3)m.push(['w','Kunci isian singkat terlalu panjang; CBT menilai jawaban yang persis sama.'])}
  if(s.tipe==='ESY'&&!s.kunci)m.push(['b','Jawaban rujukan kosong.']);
  if(s.cek){
    if(s.cek.kunciBenar===false)m.push(['b','Cek AI: kunci jawaban diragukan.'+(s.cek.catatan?' '+s.cek.catatan:'')]);
    if(s.cek.sesuai===false)m.push(['b','Cek AI: soal kurang sesuai indikator.'+(s.cek.catatan&&s.cek.kunciBenar!==false?' '+s.cek.catatan:'')]);
    if(s.cek.level&&band(s.cek.level)!==band(row.level))m.push(['w',`Cek AI: soal ini terukur ${s.cek.level}, kisi-kisi ${row.level}.`,'level']);
  }
  return m;
}

async function bacaMateri(files){
  busy(true,'Membaca file…');
  try{
    for(const f of files){
      let t='';
      if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){
        await siapPdf();
        const pdf=await window.pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
        for(let i=1;i<=pdf.numPages;i++){
          $('#busyProg').textContent=`${f.name}: halaman ${i}/${pdf.numPages}`;
          const tc=await (await pdf.getPage(i)).getTextContent();
          t+=tc.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join('').replace(/[ \t]+/g,' ').replace(/ ?\n ?/g,'\n')+'\n';
        }
      }else t=await f.text();
      t=t.replace(/\n{3,}/g,'\n\n').trim();
      if(t.length<50){toast(`${f.name}: teks tidak terbaca (mungkin PDF hasil scan).`);continue}
      P.materi=(P.materi?P.materi+'\n\n':'')+`=== ${f.name} ===\n`+t;
      P.sumber.push({nama:f.name,chars:t.length});
    }
    simpan();
  }catch(e){pesan('Gagal membaca file',esc(e.message))}
  finally{busy(false);render()}
}
async function aiCP(){
  if(!str(P.materi)&&!str(P.topik)){toast('Isi materi dulu.');return}
  STOP=false;busy(true,'AI membaca materi…');
  try{
    const o=await aiJSON(promptCP(),'Usulan CP');
    const cp=arr(o.cp).map((c,i)=>({kode:str(c.kode)||String(i+1),teks:str(c.teks||c)})).filter(c=>c.teks);
    if(cp.length){
      const kosong=P.cp.every(c=>!str(c.teks));
      if(kosong||confirm('Ganti daftar CP/TP yang ada dengan usulan AI?')){P.cp=cp;P.kisi.forEach(r=>{if(!cp.some(c=>c.kode===r.cp))r.cp=cp[0].kode})}
    }
    if(arr(o.topik).length&&!str(P.topik))P.topik=arr(o.topik).map(str).join('\n');
    simpan();toast('Usulan AI dimasukkan. Periksa dan sesuaikan.');
  }catch(e){pesan('Gagal',esc(e.message))}
  finally{busy(false);render()}
}

    let rows=normKisi(await aiJSON(promptKisi(c),'Kisi-kisi'));
    let jadi=[],kurang={};
    URUT.forEach(t=>{const a=rows.filter(r=>r.tipe===t).slice(0,c[t]);jadi.push(...a);if(a.length<c[t])kurang[t]=c[t]-a.length});
    if(Object.keys(kurang).length){
      busy(true,'Melengkapi butir yang kurang…');
      const r2=normKisi(await aiJSON(promptKisi(kurang,jadi),'Kisi-kisi'));
      Object.keys(kurang).forEach(t=>jadi.push(...r2.filter(r=>r.tipe===t).slice(0,kurang[t])));
    }
    jadi.sort((a,b)=>URUT.indexOf(a.tipe)-URUT.indexOf(b.tipe));
    P.kisi=jadi;P.soal={};simpan();
    const kur=URUT.filter(t=>jadi.filter(r=>r.tipe===t).length<c[t]);
    toast(kur.length?'Sebagian butir belum lengkap: '+kur.join(', ')+'. Tambah manual atau susun ulang.':'Kisi-kisi selesai. Periksa sebelum lanjut.');
  }catch(e){pesan('Gagal menyusun kisi-kisi',esc(e.message))}
  finally{busy(false);render()}
}
async function genSoal(rows,catatan){
  const c=aiCfg();STOP=false;busy(true,'Menyiapkan…');let done=0,err=null;
  try{
    for(let i=0;i<rows.length;i+=c.batch){
      const part=rows.slice(i,i+c.batch);
      $('#busyProg').textContent=`${done}/${rows.length} soal selesai`;
      $('#busyText').textContent=`Menulis soal nomor ${part.map(nomor).join(', ')}…`;
      const out=await aiJSON(promptSoal(part,catatan),'Membuat soal');
      const list=arr(out&&(out.soal||out.butir)||out);
      part.forEach((r,k)=>{
        const raw=list.find(x=>x&&String(x.id)===r.id)||(list.length===part.length?list[k]:null);
        if(raw&&typeof raw==='object'){P.soal[r.id]=normSoal(raw,r);seimbangkan(P.soal[r.id]);done++}
      });
      simpan();
      if(i+c.batch<rows.length&&c.jeda>0)await tunggu(c.jeda*1000,'Jeda {s} detik agar tidak kena batas kuota…');
    }
  }catch(e){err=e}
  finally{busy(false);render()}
  if(err)pesan('Pembuatan soal terhenti',`${done} soal sudah tersimpan.<br>${esc(err.message)}<br><br>Tekan <b>Lanjutkan soal yang belum</b> untuk meneruskan.`);
  else if(done<rows.length)toast(`${done} soal dibuat; ${rows.length-done} terlewat. Tekan "Lanjutkan".`);
  else toast(`${done} soal selesai dibuat.`);
}
async function cekSemua(){
  const list=P.kisi.map(row=>({row,s:P.soal[row.id]})).filter(x=>x.s);
  if(!list.length)return;
  const c=aiCfg();STOP=false;busy(true,'Memeriksa keselarasan…');let done=0,err=null;
  try{
    for(let i=0;i<list.length;i+=8){
      const part=list.slice(i,i+8);
      $('#busyProg').textContent=`${done}/${list.length} soal diperiksa`;
      const out=await aiJSON(promptCek(part),'Cek keselarasan');
      arr(out&&out.hasil||out).forEach(h=>{const x=part.find(p=>p.row.id===String(h.id));if(x){x.s.cek={sesuai:h.sesuai!==false,level:h.level?normLevel(h.level):'',kunciBenar:h.kunciBenar!==false,catatan:str(h.catatan)};done++}});
      simpan();
      if(i+8<list.length&&c.jeda>0)await tunggu(c.jeda*1000,'Jeda {s} detik…');
    }
  }catch(e){err=e}
  finally{busy(false);render()}
  if(err)pesan('Pemeriksaan terhenti',`${done} soal sudah diperiksa.<br>${esc(err.message)}`);
  else toast(`${done} soal diperiksa.`);
}
function simpanEdit(card,s){
  const g=f=>card.querySelector(`[data-f="${f}"]`);
  s.stem=g('stem').value.trim();s.pembahasan=g('pembahasan').value.trim();s.skor=num(g('skor').value)||1;
  if(s.tipe==='PG'||s.tipe==='PGX'){
    s.opsi=[...card.querySelectorAll('[data-f="opsi"]')].map(e=>e.value.trim());
    s.kunci=[...card.querySelectorAll('[data-f="kunciPick"]:checked')].map(e=>e.value).sort().join(',');
  }else if(s.tipe==='BNR'){
    s.pernyataan=g('bnr').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^([BbSs])\s*[|:]\s*(.*)$/);return m?{teks:m[2].trim(),benar:m[1].toUpperCase()==='B'}:{teks:l,benar:true}});
  }else if(s.tipe==='JD'||s.tipe==='JDX'){
    s.pasangan=g('jd').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf('=');return i<0?{kiri:l,kanan:''}:{kiri:l.slice(0,i).trim(),kanan:l.slice(i+1).trim()}});
    if(s.tipe==='JDX')s.pengecoh=g('pengecoh').value.split('\n').map(l=>l.trim()).filter(Boolean);
  }else if(s.tipe==='URT'){
    s.urutan=g('urt').value.split('\n').map(l=>l.trim()).filter(Boolean);
  }else{s.kunci=g('kunci').value.trim();if(s.tipe==='ESY')s.pedoman=g('pedoman').value.trim()}
  s.cek=null;
}
function regenModal(id){
  const row=P.kisi.find(r=>r.id===id);
  modal(`<h2>${P.soal[id]?'Buat ulang':'Buat'} soal no ${nomor(row)}</h2><p class="small muted">${esc(row.tipe)} · ${esc(row.level)} · ${esc(row.indikator)}</p>
   <label>Catatan untuk AI (opsional)</label><textarea id="regenNote" rows="3" placeholder="Contoh: pakai konteks antrean kantin; tingkatkan ke level analisis"></textarea>
   <div class="row end" style="margin-top:12px"><button data-act="closeModal">Batal</button><button class="pri" data-act="regenGo" data-id="${id}">✨ Buat</button></div>`);
}
function bantuan(){
  pesan('Panduan singkat',`<ol style="padding-left:18px"><li><b>Pengaturan AI</b> (⚙️): tempel API key Gemini/OpenRouter, lalu Tes koneksi.</li><li><b>Identitas</b>: isi mapel, kelas, guru, kepala sekolah.</li><li><b>Materi & CP</b>: unggah PDF materi, tulis atau usulkan CP/TP.</li><li><b>Kisi-kisi</b>: atur jumlah soal per bentuk dan level, susun dengan AI, lalu periksa.</li><li><b>Soal</b>: buat semua soal, jalankan Cek keselarasan, perbaiki yang ditandai.</li><li><b>Ekspor</b>: unduh kisi-kisi, kartu soal, naskah, kunci, dan file CBT.</li></ol><p class="small muted">Soal buatan AI wajib diperiksa guru sebelum dipakai.</p>`);
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');
  if(!b){if(!e.target.closest('#menuPop'))$('#menuPop').classList.add('hidden');if(e.target.id==='modal')tutupModal();return}
  const a=b.dataset.act;
  if(a!=='menu')$('#menuPop').classList.add('hidden');
  const kid=b.closest('[data-kisi]')&&b.closest('[data-kisi]').dataset.kisi;
  const sid=b.closest('[data-soal]')&&b.closest('[data-soal]').dataset.soal;
  switch(a){
    case 'menu':$('#menuPop').classList.toggle('hidden');break;
    case 'go':editId=null;step=+b.dataset.step;render();scrollTo(0,0);break;
    case 'prev':if(step>1){editId=null;step--;render();scrollTo(0,0)}break;
    case 'next':
      if(step===1&&!str(P.identitas.mapel)){toast('Isi mata pelajaran dulu.');return}
      if(step<5){editId=null;step++;render();scrollTo(0,0)}break;
    case 'stop':STOP=true;$('#busyText').textContent='Menghentikan…';break;
    case 'closeModal':tutupModal();break;
    case 'newProj':if(confirm('Buat proyek baru? Proyek sekarang akan diganti (simpan ke file dulu jika perlu).')){P=proyekBaru(P);step=1;editId=null;simpan();render()}break;
    case 'saveFile':{const blob=new Blob([JSON.stringify(P,null,1)],{type:'application/json'});unduh(blob,`asesmen_${(P.identitas.mapel||'proyek').replace(/\W+/g,'_')}_${(P.identitas.kelas||'').replace(/\W+/g,'_')}.json`);break}
    case 'openFile':$('#fProj').click();break;
    case 'help':bantuan();break;
    case 'openSettings':bukaPengaturan();break;
    case 'prov':{const c=bacaForm();c.provider=b.dataset.p;c.model=c.provider==='gemini'?'gemini-2.5-flash':'google/gemini-2.5-flash';modelList=[];aiSave(c);bukaPengaturan();badge();break}
    case 'lihatKey':{const k=$('#aiKey');k.type=k.type==='password'?'text':'password';break}
    case 'muatModel':{const c=bacaForm();aiStatus('Memuat daftar model…');
      try{
        if(c.provider==='gemini'){if(!c.key)throw new Error('Isi API key dulu.');const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':c.key}});const t=await r.text();if(!r.ok)throw new Error(pesanGalat(r.status,t,c));modelList=(JSON.parse(t).models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,''))}
        else{const r=await fetch('https://openrouter.ai/api/v1/models');const j=await r.json();modelList=(j.data||[]).map(m=>m.id)}
        $('#dlModel').innerHTML=modelList.map(m=>`<option value="${esc(m)}">`).join('');
        aiStatus(`${modelList.length} model tersedia. Ketuk kolom Model untuk memilih.`,'');
      }catch(err){aiStatus(err.message,'bad')}break}
    case 'tesAI':{const c=bacaForm();if(!c.key){aiStatus('Isi API key dulu.','bad');break}aiSave(c);aiStatus('Menghubungi AI…');
      try{const r=await kirim(c,'Jawab hanya JSON.','Balas dengan {"ok":true}');const t=await r.text();if(!r.ok)throw new Error(pesanGalat(r.status,t,c));const o=parseJSON(ambilTeks(c,JSON.parse(t)));aiStatus(o&&o.ok?'✓ Terhubung. AI siap dipakai.':'Terhubung, tetapi jawaban tidak sesuai. Coba model lain.',o&&o.ok?'':'warn')}
      catch(err){aiStatus(err.message,'bad')}badge();break}
    case 'simpanAI':aiSave(bacaForm());tutupModal();badge();toast('Pengaturan AI disimpan.');break;
    case 'hapusKey':{const c=bacaForm();c.key='';aiSave(c);$('#aiKey').value='';badge();aiStatus('Key dihapus dari perangkat ini.','');break}
    case 'upMateri':$('#fMateri').click();break;
    case 'clearMateri':if(confirm('Kosongkan semua teks materi?')){P.materi='';P.sumber=[];simpan();render()}break;
    case 'cpAdd':{const k=P.cp.reduce((m,c)=>Math.max(m,parseInt(c.kode)||0),0)+1;P.cp.push({kode:String(k),teks:''});simpan();render();break}
    case 'cpDel':if(P.cp.length>1){P.cp.splice(+b.dataset.i,1);simpan();render()}break;
    case 'aiCP':aiCP();break;
    case 'genKisi':genKisi();break;
    case 'kisiAdd':P.kisi.push({id:uid(),cp:(P.cp[0]||{}).kode||'1',materi:'',level:'C3',indikator:'',tipe:'PG'});simpan();render();break;
    case 'kisiDel':if(confirm('Hapus butir ini (dan soalnya)?')){P.kisi=P.kisi.filter(r=>r.id!==kid);delete P.soal[kid];simpan();render()}break;
    case 'kisiMove':{const i=P.kisi.findIndex(r=>r.id===kid),j=i+(+b.dataset.d);if(j>=0&&j<P.kisi.length){[P.kisi[i],P.kisi[j]]=[P.kisi[j],P.kisi[i]];simpan();render()}break}
    case 'kisiSort':P.kisi.sort((x,y)=>URUT.indexOf(x.tipe)-URUT.indexOf(y.tipe));simpan();render();break;
    case 'genSisa':genSoal(P.kisi.filter(r=>!P.soal[r.id]));break;
    case 'cekAll':cekSemua();break;
    case 'filterProb':filterProb=!filterProb;render();break;
    case 'soalEdit':editId=sid;render();break;
    case 'soalBatal':editId=null;render();break;
    case 'soalSimpan':simpanEdit(b.closest('[data-soal]'),P.soal[sid]);editId=null;simpan();render();toast('Soal disimpan.');break;
    case 'soalDel':if(confirm('Hapus soal ini? Butir kisi-kisi tetap ada.')){delete P.soal[sid];simpan();render()}break;
    case 'soalRegen':regenModal(sid);break;
    case 'regenGo':{const id=b.dataset.id;const note=$('#regenNote').value.trim();tutupModal();genSoal(P.kisi.filter(r=>r.id===id),note);break}
    case 'pakaiLevel':{const row=P.kisi.find(r=>r.id===sid),s=P.soal[sid];if(row&&s&&s.cek){row.level=s.cek.level;simpan();render()}break}
    case 'exp':{busy(true,'Membuat dokumen…');try{await siapDocx();const {blob,name}=await window.GAS_EXPORT.make(b.dataset.kind,P);unduh(blob,name);toast('Dokumen diunduh: '+name)}catch(err){pesan('Gagal membuat dokumen',esc(err.message))}finally{busy(false)}break}
  }
});
const main=$('#main');
main.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.bind){
    const ks=t.dataset.bind.split('.');let o=P;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];
    o[ks[ks.length-1]]=t.type==='checkbox'?t.checked:(t.type==='number'?num(t.value):t.value);
    simpanNanti();
    if(t.dataset.bind==='materi')$('#cntMateri').textContent=P.materi.length.toLocaleString('id-ID')+' huruf';
    if(/^bp\.(PG|PGX|BNR|JD|JDX|URT|SKT|ESY)$/.test(t.dataset.bind)){const n=Object.values(hitung()).reduce((a,b)=>a+b,0);$('#totSoal').textContent=`Total: ${n} soal`}
    if(/^bp\.l[123]$/.test(t.dataset.bind))$('#lvWarn').classList.toggle('hidden',num(P.bp.l1)+num(P.bp.l2)+num(P.bp.l3)===100);
    if(/^identitas\.(mapel|kelas|asesmen)$/.test(t.dataset.bind)){const I=P.identitas;$('#projLabel').textContent=[I.mapel,I.kelas&&('Kelas '+I.kelas)].filter(Boolean).join(' · ')}
    return;
  }
  if(t.dataset.cpi!=null){
    const c=P.cp[+t.dataset.cpi];const old=c.kode;c[t.dataset.k]=t.value;
    if(t.dataset.k==='kode')P.kisi.forEach(r=>{if(r.cp===old)r.cp=t.value});
    simpanNanti();return;
  }
  const kr=t.closest('[data-kisi]');
  if(kr&&t.dataset.k){
    const row=P.kisi.find(r=>r.id===kr.dataset.kisi);if(!row)return;
    row[t.dataset.k]=t.value;
    if(P.soal[row.id])P.soal[row.id].cek=null;
    simpanNanti();
    if(t.tagName==='SELECT')render();
  }
});
$('#fMateri').addEventListener('change',e=>{const f=[...e.target.files];e.target.value='';if(f.length)bacaMateri(f)});
$('#fProj').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const p=JSON.parse(await f.text());if(!p||!p.versi||!Array.isArray(p.kisi))throw new Error('Bukan file proyek Generator Asesmen Sumatif.');
    if(!confirm('Buka proyek ini? Proyek yang sedang terbuka akan diganti.'))return;
    P=lengkapi(p);step=P.step||1;editId=null;simpan();render();toast('Proyek dibuka.')}
  catch(err){pesan('Gagal membuka file',esc(err.message))}
});
window.addEventListener('beforeunload',simpan);
render();
if(!aiCfg().key)setTimeout(()=>toast('Isi API key di ⚙️ Pengaturan AI sebelum memakai fitur AI.'),600);
</script>
